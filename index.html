<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#78e4c6">
<title>視聽中心排班系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#78e4c6; --mint-d:#4db6ac; --mint-dd:#2e8b7a; --mint-ink:#00695c; --mint-bg:#e6f8f1;
  --cream:#fcf8e8; --cream-2:#fffdf5; --sand:#e8dfc4; --sand-d:#d7ccc8;
  --bark:#5d4037; --bark-2:#8d6e63; --bark-3:#a1887f;
  --coral:#ff8a65; --coral-bg:#fff3e0; --rose:#e57373; --rose-bg:#ffebee;
  --sky:#42a5f5; --sky-bg:#e3f2fd; --sun:#fbc02d; --sun-bg:#fff8e1; --grape:#7e57c2; --grape-bg:#ede7f6;
  --leaf:#43a047; --leaf-bg:#e8f5e9;
  --page:#eef6f1; --card:#ffffff; --line:#efe9d8;
  --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:32px;
  --shadow:0 6px 0 rgba(93,64,55,.06), 0 10px 24px rgba(93,64,55,.08);
  --shadow-sm:0 3px 0 rgba(93,64,55,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--page); color:var(--bark); font-size:14px; line-height:1.5;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(120,228,198,.35) 2px, transparent 2.5px);
  background-size:28px 28px;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--bark)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint-d);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ico.sm{width:14px;height:14px}.ico.lg{width:22px;height:22px}.ico.xl{width:40px;height:40px}
.hidden{display:none!important}
.muted{color:var(--bark-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
#app{max-width:1280px;margin:0 auto;padding:14px 16px 96px;min-height:100%}
.topbar{
  background:var(--mint);border-radius:0 0 var(--r-xl) var(--r-xl);margin:-14px -4px 18px;
  padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-bottom:5px solid #5cb8a1;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.topbar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(#fff 22%,transparent 23%);background-size:22px 22px}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.brand-badge{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--mint-dd);box-shadow:var(--shadow-sm)}
.brand h1{margin:0;font-size:20px;font-weight:900;color:#2f7a68;letter-spacing:.06em;text-shadow:1px 1px 0 #fff;line-height:1.2}
.brand .sub{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pill-white{background:rgba(255,255,255,.92);border:2px solid var(--sand);color:var(--bark)}
.pill-cream{background:var(--cream);border:2px solid var(--sand);color:var(--bark-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip-admin{background:var(--coral);color:#fff}.chip-user{background:var(--sky);color:#fff}
.chip-co{background:var(--sun);color:#fff}
.chip-grey{background:#f2efe6;color:var(--bark-2)}
.chip-grape{background:var(--grape-bg);color:var(--grape)}
.chip-rose{background:var(--rose-bg);color:#c62828}
.chip-leaf{background:var(--leaf-bg);color:#2e7d32}
.chip-away{background:#ffe0b2;color:#e65100}

.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);
  border:2px solid var(--sand);color:var(--bark-2);transition:transform .15s, background .15s}
.icon-btn:hover{background:var(--sun-bg);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.danger{background:#ef9a9a;border-color:#e57373;color:#fff}

.month-nav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.92);border:2px solid var(--sand);border-radius:999px;padding:2px}
.month-nav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--bark-2)}
.month-nav button:hover{background:var(--sun-bg)}
.month-nav .label{font-weight:900;font-size:14px;padding:0 6px;min-width:96px;text-align:center;position:relative;cursor:pointer}
.month-nav input[type=month]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.shell{display:flex;gap:18px;align-items:flex-start}
.sidenav{position:sticky;top:14px;display:flex;flex-direction:column;gap:10px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px;padding:10px 4px;border-radius:22px;
  background:#fff;border:3px solid var(--line);color:var(--bark-3);font-size:11.5px;font-weight:800;transition:transform .15s}
.nav-btn:hover{transform:translateY(-2px);color:var(--bark)}
.nav-btn.on{color:#fff;box-shadow:var(--shadow)}
.main{flex:1;min-width:0}
.bottomnav{display:none}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--r-lg);border:4px solid var(--line);box-shadow:var(--shadow);padding:16px}
.card-cream{background:var(--cream);border-color:var(--sand)}
.card-title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.card-title h2{margin:0;font-size:16px;font-weight:900}
.card-title p{margin:0;font-size:11.5px;color:var(--bark-3)}
.title-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow-sm)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:18px;font-weight:900;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:14px;font-weight:800;
  transition:transform .12s, filter .12s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.04)}
.btn-primary{background:var(--mint-d);color:#fff;box-shadow:0 4px 0 #3a9a90}
.btn-soft{background:#f3efe4;color:var(--bark)}
.btn-danger{background:#ffcdd2;color:#c62828}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 #e0704f}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  background:var(--cream);border:4px solid var(--sand);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:12px}
.seg{display:inline-flex;background:#fff;border:3px solid var(--sand);border-radius:999px;padding:2px}
.seg button{padding:5px 14px;border-radius:999px;font-weight:800;font-size:12.5px;color:var(--bark-2);display:inline-flex;gap:5px;align-items:center}
.seg button.on{background:var(--mint-d);color:#fff}
.week-nav{display:flex;align-items:center;gap:6px}
.round-btn{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--sand);display:grid;place-items:center;color:var(--bark-2)}
.round-btn:hover{background:var(--sun-bg)}
.round-btn[disabled]{opacity:.4;pointer-events:none}
.week-label{background:#fff;border:3px solid var(--sand);border-radius:16px;padding:3px 12px;font-weight:900;font-size:12.5px;white-space:nowrap}

.brush-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e1;border:3px dashed var(--sun);
  border-radius:var(--r-md);padding:8px 12px;margin-bottom:12px;font-weight:700;font-size:13px}
.brush-bar .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}

/* ---------- Shift tokens ---------- */
.shift{border:2px solid;border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend .shift{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px}
.shift-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.shift-pick button{padding:8px 4px;font-weight:800;font-size:13px;text-align:center;transition:transform .12s}
.shift-pick button:hover{transform:translateY(-2px)}
.shift-pick button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--bark)}
.brush-chip{padding:4px 10px;font-size:12px;font-weight:800;border-radius:999px}
.brush-chip.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bark)}

/* ---------- Schedule board ---------- */
.board{background:#fff;border:6px solid var(--bark-2);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:12px 10px 8px;position:relative}
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board-scroll::-webkit-scrollbar{height:8px}.board-scroll::-webkit-scrollbar-thumb{background:var(--sand);border-radius:8px}
table.grid{border-collapse:separate;border-spacing:6px;width:100%}
table.grid th,table.grid td{padding:0}
.col-name{position:sticky;left:0;z-index:3;background:#fff;min-width:96px;width:96px}
.col-name-inner{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px 4px 0;border-right:3px dashed var(--sand-d)}
.col-name .nm{font-weight:900;font-size:12.5px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hours{font-size:10px;font-weight:800;color:#fff;background:var(--sky);border-radius:999px;padding:0 7px}
.away-tag{font-size:10px;font-weight:800;color:#e65100;background:#ffe0b2;border-radius:999px;padding:0 7px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.dayhead{border-radius:16px;border:2px solid #eee;background:#f6f6f4;text-align:center;padding:5px 0;position:relative;min-width:88px}
.dayhead .d{font-weight:900;font-size:15px;line-height:1.1}
.dayhead .w{font-size:10.5px;font-weight:800;color:#9e9e9e}
.dayhead.wkend{background:#ffebee;border-color:#ffcdd2}
.dayhead.today{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun);background:#fffde7}
.dayhead.out{opacity:.3}
.dayhead .evt{position:absolute;top:-6px;right:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:0 6px;border:2px solid #fff}
.dayhead.clickable{cursor:pointer}
.dayhead.clickable:hover{filter:brightness(.97)}
.cell{width:100%;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;
  transition:transform .12s, box-shadow .12s;box-shadow:var(--shadow-sm)}
.cell:hover{transform:scale(1.05);z-index:2}
.cell.locked{cursor:default}.cell.locked:hover{transform:none}
.cell .lb{font-weight:900;font-size:13px;line-height:1}
.cell .tm{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.75);color:#6a1b9a;border-radius:6px;padding:0 4px;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .nt{position:absolute;left:0;right:0;bottom:0;background:#fff59d;color:var(--bark);font-size:9px;line-height:13px;height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.cell .ot{position:absolute;top:0;right:0;width:14px;height:14px;background:#ef5350;border-bottom-left-radius:8px}
.cell.auto{opacity:.88}
.cell.empty{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px);border:2px dashed #eee;box-shadow:none;cursor:default}
.cell.empty:hover{transform:none}
tr.me .col-name .nm{color:var(--mint-dd)}
tr.me .col-name-inner{background:linear-gradient(90deg,var(--mint-bg),transparent);border-radius:12px 0 0 12px}
tr.dim{opacity:.5;filter:grayscale(.6)}
.brushing .cell:not(.empty){cursor:crosshair}

/* month grid */
table.mgrid{border-collapse:separate;border-spacing:3px;width:100%}
table.mgrid .col-name{min-width:84px;width:84px}
table.mgrid .col-name-inner{flex-direction:row;justify-content:flex-start;gap:6px;padding:2px 6px 2px 2px}
table.mgrid .col-name .nm{font-size:12px;max-width:52px}
.mhead{min-width:26px;text-align:center;border-radius:9px;background:#f6f6f4;padding:3px 0;position:relative}
.mhead .d{font-weight:900;font-size:12px;line-height:1.1}.mhead .w{font-size:9.5px;color:#9e9e9e;font-weight:800}
.mhead.wkend{background:#ffebee}.mhead.today{background:#fff59d;box-shadow:0 0 0 2px var(--sun)}
.mhead .dot{position:absolute;top:-3px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:1.5px solid #fff}
.mcell{width:100%;min-width:26px;height:30px;border-radius:8px;border-width:2px;font-size:12px;font-weight:900;display:grid;place-items:center;position:relative;transition:transform .1s}
.mcell:hover{transform:scale(1.15);z-index:2}
.mcell .ot{position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:#ef5350;border-radius:50%}
.mcell .nt{position:absolute;bottom:-1px;left:3px;right:3px;height:3px;background:#f9a825;border-radius:2px}
.mcell.locked:hover{transform:none}
.col-sum{min-width:56px;text-align:center;font-weight:900;font-size:12px;color:var(--sky)}
td.col-today{background:rgba(255,245,157,.35);border-radius:8px}

/* ---------- Dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--cream);border:4px solid var(--sand);border-radius:var(--r-lg);padding:14px 10px;text-align:center;transition:transform .15s}
.stat:hover{transform:translateY(-3px)}
.stat .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.stat .k{font-size:12px;font-weight:800;color:var(--bark-2)}
.stat .v{font-size:26px;font-weight:900;line-height:1.2}
.stat .v small{font-size:12px;color:var(--bark-3);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.today-col h3{margin:0 0 8px;font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:800;font-size:12.5px}
.person small{font-weight:700;color:var(--bark-3)}
.rank{display:flex;flex-direction:column;gap:7px}
.rank-row{display:grid;grid-template-columns:28px 32px 1fr auto;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;border:2px solid var(--line);background:#fff}
.rank-row .no{font-weight:900;text-align:center;color:#cfcfcf}
.rank-row .no.top{color:#ffb300}
.rank-row .nm{font-weight:800;font-size:13px;min-width:0}
.bar{height:6px;border-radius:6px;background:#f3efe4;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.rank-row .val{font-weight:900;font-size:15px}
.empty-state{text-align:center;color:var(--bark-3);padding:22px 0;font-weight:700}

/* ---------- Residents ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.res{background:#fff;border:4px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative}
.res.me{border-color:var(--mint)}
.res.gone{opacity:.6;filter:grayscale(.7)}
.res-top{display:flex;gap:12px;align-items:center}
.res-top .nm{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
.res-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.res-meta div{background:#faf8f2;border-radius:10px;padding:5px 8px}
.res-meta b{display:block;font-size:13.5px}
.res-del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--rose-bg);color:#e53935;opacity:.7}
.res-del:hover{opacity:1}
.res-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:10px}

/* ---------- Avatar ---------- */
.av{border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12);display:grid;place-items:center;overflow:hidden;flex:none;position:relative;line-height:1}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;display:inline-block;flex:none}
.av-badge{position:absolute;right:-4px;top:-4px;background:#e1bee7;border:2px solid #fff;border-radius:50%;width:17px;height:17px;font-size:9px;display:grid;place-items:center}
.av-away{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;background:#ff9800;border:2px solid #fff;animation:pulse 1.6s infinite}

/* ---------- Audit ---------- */
.search{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--sand);border-radius:999px;padding:5px 12px;min-width:220px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:left;font-weight:900;color:var(--bark-2);background:#f7f4ea;padding:8px 10px;position:sticky;top:0}
table.log td{padding:8px 10px;border-top:2px solid #f5f2ea;vertical-align:top}
table.log tr:hover td{background:#fffde7}
.log-wrap{max-height:68vh;overflow:auto;border-radius:16px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-size:12px;font-weight:800;color:var(--bark-2)}
.inp{width:100%;background:#fff;border:2px solid #e8e2d2;border-radius:12px;padding:9px 12px;font-weight:700;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--mint-d)}
.inp-soft{background:#f5f5f2;border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--mint-d)}
.box{background:#faf8f2;border:2px solid #efe9d8;border-radius:14px;padding:10px 12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid #eee;border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer}
.toggle.on{border-color:#ef9a9a;background:#fff5f5;color:#c62828}
.switch{width:42px;height:24px;border-radius:999px;background:#ddd;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .switch{background:#ef5350}.toggle.on .switch::after{left:21px}
.seg-list{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.seg-item{display:inline-flex;align-items:center;gap:4px;background:var(--grape-bg);color:#5e35b1;border-radius:999px;padding:3px 6px 3px 10px;font-weight:800;font-size:12.5px}
.seg-item button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.seg-item button:hover{background:rgba(0,0,0,.08)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:118px;overflow:auto;padding:4px}
.emoji-grid button{font-size:20px;height:34px;border-radius:10px}
.emoji-grid button:hover{background:var(--sun-bg)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid}
.swatches button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bark)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.enter{animation:fade .2s ease}
.sheet{background:var(--cream-2);width:100%;max-width:520px;max-height:90vh;border-radius:var(--r-xl);border:6px solid #fff;
  box-shadow:0 0 0 4px var(--sand),0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:680px}
.overlay.enter .sheet{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.sheet-head h2{margin:0;font-size:18px;font-weight:900;flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet-head .x{width:34px;height:34px;border-radius:50%;background:#f0ede4;display:grid;place-items:center}
.sheet-body{padding:8px 18px 18px;overflow:auto}
.sheet-foot{padding:12px 18px 16px;display:flex;gap:8px;border-top:2px dashed var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}

.away-hero{text-align:center;padding:4px 0 10px}
.away-hero .st{display:inline-block;margin-top:6px;font-weight:900;font-size:13px;padding:3px 12px;border-radius:999px}
.away-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.away-grid button{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 4px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.away-grid button:hover{transform:translateY(-3px);border-color:var(--mint)}
.away-grid button span{font-size:28px;line-height:1}
.big-timer{font-size:42px;font-weight:900;color:#e65100;line-height:1.1}

/* ---------- Login ---------- */
.login-wrap{min-height:calc(100vh - 40px);display:grid;place-items:center}
.login{width:100%;max-width:420px;background:#fff;border:6px solid var(--mint);border-radius:var(--r-xl);padding:28px 24px;box-shadow:var(--shadow);animation:pop .3s ease}
.login .logo{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-sm)}
.login h1{text-align:center;margin:0;font-size:22px;font-weight:900;color:var(--mint-ink)}
.login p.tag{text-align:center;margin:2px 0 20px;font-weight:700;color:var(--bark-2);font-size:13px}
.err{background:var(--rose-bg);color:#c62828;font-weight:800;font-size:12.5px;padding:9px 12px;border-radius:12px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:80;transition:all .25s;
  background:var(--bark);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;display:flex;gap:8px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#c62828}

.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeUp .3s ease}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two,.three{grid-template-columns:1fr}
}
@media (max-width:760px){
  #toast{bottom:96px}
  #app{padding:10px 12px 92px}
  .topbar{margin:-10px -4px 14px;padding:12px 14px;border-radius:0 0 26px 26px}
  .brand h1{font-size:17px}
  .brand-badge{width:40px;height:40px}
  .top-actions .hide-m{display:none}
  .sidenav{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cream);border-top:3px solid var(--sand);
    justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--bark-3);padding:5px 14px;border-radius:14px}
  .bottomnav button.on{color:var(--mint-dd);background:#fff;box-shadow:var(--shadow-sm)}
  .overlay{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{max-width:none;border-radius:28px 28px 0 0;max-height:92vh;border-bottom:0}
  .overlay.enter .sheet{animation:slideUp .25s ease}
  .dayhead{min-width:74px}
  .cell{height:54px}
  .col-name,table.grid .col-name{min-width:72px;width:72px}
  .col-name .nm{max-width:66px}
  .away-grid{grid-template-columns:repeat(3,1fr)}
}
@keyframes slideUp{from{transform:translateY(100%)}}

@media print{
  body{background:#fff}
  .topbar .top-actions,.sidenav,.bottomnav,.toolbar,.brush-bar,.legend-toggle,#toast{display:none!important}
  .topbar{box-shadow:none;border:0;margin:0 0 8px;background:#fff}
  .board{border:2px solid #999;box-shadow:none}
  .board-scroll{overflow:visible}
  #app{max-width:none;padding:0}
  .mcell,.shift{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== v36.1：自己的列、今日卡、離席警示、加班、16:9 ===== */
tr.me > th, tr.me > td{background:#d9f5ea}
tr.me > th{border-radius:16px 0 0 16px}
tr.me > td:last-child{border-radius:0 16px 16px 0}
tr.me .col-name-inner{background:none;border-right-color:var(--mint-d)}
tr.me .cell{box-shadow:0 0 0 2px var(--mint-d),var(--shadow-sm)}
tr.me .mcell{box-shadow:0 0 0 1.5px var(--mint-d)}
.me-tag{font-size:10px;font-weight:900;color:#fff;background:var(--mint-d);border-radius:999px;padding:0 7px}
table.mgrid .me-tag{padding:0 5px}
tr.me + tr > th, tr.me + tr > td{border-top:0}

.mytoday{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#e0f7ef,#fff 70%);border:4px solid var(--mint);
  border-radius:var(--r-lg);padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.mt-main{flex:1;min-width:0}
.mt-hi{font-weight:800;font-size:13px;color:var(--bark-2);margin-bottom:4px}
.mt-shift{font-size:16px;font-weight:900;padding:3px 14px;border-radius:12px}
.mt-side{display:flex;align-items:center;gap:16px}
.mt-side div{text-align:center;line-height:1.15}
.mt-side small{display:block;font-size:11px;color:var(--bark-3);font-weight:800}
.mt-side b{font-size:17px;font-weight:900}

.away-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff3e0;border:4px solid #ffb74d;border-radius:var(--r-lg);
  padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:30;animation:glow 2s ease-in-out infinite}
.away-banner .ab-icon{font-size:30px;line-height:1}
.away-banner .ab-text{flex:1;min-width:200px;display:flex;flex-direction:column}
.away-banner .ab-text>b{font-size:16px;color:#e65100}
.away-banner .ab-text span{font-weight:700;color:var(--bark-2)}
.away-banner .ab-btn{background:#fb8c00;color:#fff;box-shadow:0 4px 0 #e65100;font-size:15px;padding:10px 20px}
.away-banner.late{background:#ffebee;border-color:#e53935;animation:glowRed 1.2s ease-in-out infinite}
.away-banner.late .ab-text>b{color:#c62828}
.away-banner.late .ab-btn{background:#e53935;box-shadow:0 4px 0 #b71c1c}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,183,77,.35),var(--shadow)}}
@keyframes glowRed{50%{box-shadow:0 0 0 8px rgba(229,57,53,.3),var(--shadow)}}
.away-admin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8e1;border:3px dashed #ffb300;border-radius:var(--r-md);
  padding:8px 12px;margin-bottom:12px;font-weight:800;color:#e65100}
.away-admin .person{cursor:pointer}

.cell .ot-tag{position:absolute;top:0;right:0;background:#ef5350;color:#fff;font-size:9px;font-weight:900;line-height:14px;padding:0 4px;border-bottom-left-radius:8px}
.cm-sec{background:#fff;border:2px solid #efe9d8;border-radius:16px;padding:12px}
.cm-sec.ot-on{border-color:#ef9a9a;background:#fffafa}
.cm-sec .toggle{border:0;padding:0;background:none}
.cm-sec .toggle.on{background:none}
.cm-h{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:8px;flex-wrap:wrap}
.cm-no{width:22px;height:22px;border-radius:50%;background:var(--mint-d);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.ot-on .cm-no{background:#ef5350}
.cm-now{font-weight:900;font-size:16px}
.cm-more{margin-top:8px}
.cm-more summary{cursor:pointer;font-weight:800;font-size:12.5px;color:var(--mint-dd)}
.hint{font-size:12px;color:var(--bark-2);background:#faf8f2;border-radius:10px;padding:7px 10px;margin:8px 0 6px;line-height:1.6}

/* 寬螢幕 16:9：用滿整個寬度，班表在一個畫面內完整顯示，人多時班表區自己捲動、日期列固定 */
@media (min-width:1200px){
  #app{max-width:none;padding:14px 28px 24px}
  .topbar{margin:-14px -12px 16px}
  .board-scroll{max-height:calc(100vh - 330px);overflow:auto}
  table.grid thead th, table.mgrid thead th{position:sticky;top:0;z-index:4;background:#fff}

  table.mgrid .mcell{height:32px;font-size:13px}
}
@media (max-width:760px){
  .mytoday{flex-wrap:wrap;padding:10px 12px}
  .mt-side{width:100%;justify-content:space-between}
  .away-banner{top:4px;padding:10px 12px}
  .away-banner .ab-btn{flex:1}
}
@media print{ .mytoday,.away-banner,.away-admin{display:none!important} }

/* ===== v36.2：部分請假、視覺化總覽 ===== */
.cell .lv-tag{position:absolute;top:0;left:0;font-size:9px;font-weight:900;line-height:13px;padding:0 4px;border-bottom-right-radius:8px;border:0!important}
.mcell .lv{position:absolute;top:-1px;left:-1px;width:7px;height:7px;border-radius:50%}
.cm-sec.lv-on{border-color:#f48fb1;background:#fffafc}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12px;font-weight:800;color:var(--bark-2)}
.kpi .v{font-size:26px;font-weight:900;line-height:1.15}
.kpi .v small{font-size:12px;color:var(--bark-3);font-weight:700}
.kpi-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi-away{border-color:#ffb74d;animation:glow 2s ease-in-out infinite}
.ring{flex:none}
.avstack{display:flex;margin-top:4px}
.avstack .av-wrap{margin-right:-7px}
.avstack .more{font-size:11px;font-weight:900;color:var(--bark-2);background:#f3efe4;border-radius:999px;padding:3px 7px;margin-left:10px;align-self:center}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:4px}
.spark i{flex:1;background:#ef5350;border-radius:2px 2px 0 0;min-width:2px}

.tl-card{margin-bottom:14px}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--bark-2)}
.tl-legend i{display:inline-block;width:18px;height:11px;border-radius:4px;border:2px solid;vertical-align:-1px;margin-right:4px}
.tl{display:flex;flex-direction:column;gap:6px}
.tl-row{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px}
.tl-row.me{background:#e6f8f1;border-radius:14px}
.tl-name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;min-width:0}
.tl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;height:30px;background:#faf8f2;border-radius:10px}
.tl-head .tl-track{height:18px;background:none}
.tl-tick{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--bark-3)}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:#eee6d4}
.tl-seg{position:absolute;top:4px;bottom:4px;border:2px solid;border-radius:7px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.tl-seg.ot{background:#ef5350;border-color:#e53935;color:#fff;top:7px;bottom:7px}
.tl-seg.away{background:#ffa726;border-color:#ef6c00;color:#fff;top:2px;bottom:2px;z-index:2;box-shadow:0 0 0 2px #fff}
.tl-off{position:absolute;inset:4px;border:2px dashed #e3dccb;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bark-3)}
.tl-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e53935;z-index:3}
.tl-row:not(:nth-child(2)) .tl-now b{display:none}
.tl-now b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:#e53935;color:#fff;font-size:10px;border-radius:6px;padding:0 4px}

.hc-w{text-align:center;font-size:11.5px;font-weight:900;color:var(--bark-3)}
.hc{position:relative;border-radius:12px;min-height:58px;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;cursor:default}

.hc-n{font-size:18px;font-weight:900;line-height:1}

.hc-ev{position:absolute;top:4px;right:5px;color:#e65100}
.hc-lv{position:absolute;bottom:5px;right:6px;font-size:10px;font-weight:900;background:rgba(255,255,255,.85);color:#8e24aa;border-radius:6px;padding:0 4px}

.donut-legend small{text-align:right}
.dash-ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.bar.bar-stack{display:flex;gap:2px;background:#f3efe4}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,1fr)} .dash-split{grid-template-columns:1fr} }
@media (max-width:760px){

  .tl-card .card-title{flex-wrap:wrap}
  .tl-card .card-title>div:nth-child(2){flex:1 1 calc(100% - 50px)!important}

/* ===== v36.4：離席時間軸、編輯、分析 ===== */
.tl-row{grid-template-columns:112px 1fr 74px}
.tl-sum{font-size:11.5px;font-weight:800;text-align:right;line-height:1.15;color:var(--bark-2)}

  font-size:10.5px;box-shadow:0 0 0 2px #fff;cursor:pointer;background-image:linear-gradient(0deg,color-mix(in srgb,var(--c) 14%,#fff),color-mix(in srgb,var(--c) 14%,#fff))}

.away-pick{display:flex;flex-wrap:wrap;gap:6px}
.away-pick label{cursor:pointer}
.away-pick input{position:absolute;opacity:0;pointer-events:none}
.away-pick span{display:inline-block;padding:5px 11px;border-radius:999px;border:2px solid #e8e2d2;background:#fff;font-weight:800;font-size:13px}

.away-pick input:focus-visible + span{outline:3px solid var(--mint-d)}
.ae-box{border-color:var(--mint-d);background:#f3fbf8}
.prop-bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}
.prop-bar i{min-width:4px}
.prop-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px;font-weight:800;color:var(--bark-2)}
.prop-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
button.rank-row{width:100%;font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
button.rank-row:hover{border-color:#ffcc80}
button.rank-row.on{border-color:#fb8c00;background:#fff8e1}
.hours-chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:190px;align-items:end;padding-top:6px}
.hcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}

/* ===== v36.5 ===== */

.tl-seg.awayDone{top:50%!important;bottom:auto!important;height:22px;transform:translateY(-50%);min-width:48px;font-size:11px!important;line-height:18px;padding:0 4px;border-radius:8px}

.tl-row.two-lane .tl-track{height:56px}
.tl-seg.awayDone.l1{top:4px!important;transform:none}
.tl-seg.awayDone.l2{top:auto!important;bottom:4px!important;transform:none}

/* 2. 人力日曆：淡色、資訊精簡 */
.hc{color:var(--bark)!important;border:2px solid #edf3ef;justify-content:flex-start;gap:2px;min-height:64px}

.hc-d{font-size:12.5px;font-weight:900;color:var(--bark-2)}
.hc-ev{position:static;color:#e65100}
.hc-hol{font-size:10.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none!important;padding:0;border-radius:0}
.hc-n{font-size:17px;font-weight:900;color:#2e7d6b;margin-top:auto}
.hc-n small{font-size:10px;color:var(--bark-3);font-weight:800}
.hc-rest{margin-top:auto;font-size:12px;font-weight:800;color:#b0a899}
.hc-lv{position:static;background:none;color:#8e24aa;padding:0;font-size:10.5px;font-weight:800}
.hc.warn{border:2px dashed #e57373}
.hc.today{border-color:var(--sun)!important;box-shadow:0 0 0 2px var(--sun)}
/* 3. 密碼眼睛 */
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--bark-2)}
.pw-eye:hover{background:#efeadb}
/* 4. 日期列顏色說明 */
.legend-note{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--bark-2);margin-left:6px}
.legend-note span{display:inline-flex;align-items:center;gap:4px}
.legend-note i{width:12px;height:12px;border-radius:3px}
/* 5. 年月選擇器 */
.topbar{overflow:visible}
.topbar::before{border-radius:inherit}
.month-nav{position:relative}
.month-nav .label{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;width:auto;height:auto}
.month-nav .label:hover{background:var(--sun-bg)}
.month-nav .mp-caret{transform:rotate(90deg)}
.mpick{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:60;width:260px;background:#fff;border:4px solid var(--sand);border-radius:20px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);animation:pop .15s ease}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mp-head b{font-size:16px;font-weight:900}
.mp-head button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.mp-head button:hover{background:var(--sun-bg)}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.mp-grid button{padding:8px 0;border-radius:12px;font-weight:800;background:#f7f4ea;width:auto;height:auto}
.mp-grid button:hover{background:var(--sun-bg)}
.mp-grid button.now{box-shadow:inset 0 0 0 2px var(--mint)}
.mp-grid button.on{background:var(--mint-d);color:#fff}
@media (max-width:760px){ .mpick{left:0;transform:none} }
.mpick .btn-block{width:100%;height:auto;border-radius:11px;display:flex;padding:7px 0}
.mpick .mp-head button{width:32px;height:32px}
.warn-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff3e0;color:#e65100;border:2px dashed #ffb74d;border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:700;margin-bottom:8px;line-height:1.6}
/* ===== v36.6 ===== */
.tl-row.two-lane .tl-track{height:30px}
.tl-seg.awayDone{width:auto!important;min-width:0;white-space:nowrap;padding:0 7px}
.tl-seg.awayDone.shifted::before{content:"";position:absolute;left:-4px;top:50%;width:4px;height:2px;background:var(--c)}
.blk-list{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:130px 1fr auto 1fr 52px 32px;align-items:center;gap:8px}
.blk-type{font-weight:900;border-width:2px;border-style:solid}
.blk-rest{grid-column:2 / 5;font-weight:800}
.blk-h{font-weight:900;color:var(--bark-2);text-align:right}
.blk-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--bark-3)}
.blk-x:hover{background:#ffebee;color:#c62828}
.blk-sum{margin-top:10px;background:#f3fbf8;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--bark)}
@media (max-width:760px){ .blk{grid-template-columns:1fr 1fr auto 1fr 26px;grid-template-areas:"t t t h x" "s s m e e"} .blk-type{grid-area:t} .blk-h{grid-area:h} .blk-x{grid-area:x} .blk input:first-of-type{grid-area:s} .blk>.muted{grid-area:m} .blk input:last-of-type{grid-area:e} }
.blk{grid-template-columns:118px minmax(0,1fr) auto minmax(0,1fr) 40px 28px;gap:6px}
.blk .inp{min-width:0;padding:8px 8px}

}

/* ===== v36.7 簡潔顯示：一般班淡化、休息日整欄灰底、只有例外上色 ===== */
.seg-sm button{padding:4px 11px;font-size:12px}
.board.calm .shift{border-color:transparent!important;box-shadow:none}
.board.calm .mcell.routine,.board.calm .cell.routine{background:transparent!important;color:#c7bfae!important;font-weight:700}
.board.calm .mcell.rest,.board.calm .cell.rest{background:transparent!important;color:transparent!important}
.board.calm .cell.routine .lb{font-weight:700;font-size:12px}
.board.calm td.col-rest{background:#f4f1ea}
.board.calm table.mgrid td.col-rest:first-of-type{border-radius:0}
.board.calm .mcell:not(.routine):not(.rest),.board.calm .cell:not(.routine):not(.rest):not(.empty){box-shadow:0 1px 0 rgba(0,0,0,.06)}
.board.calm .mcell.routine:hover,.board.calm .mcell.rest:hover,.board.calm .cell.routine:hover,.board.calm .cell.rest:hover{background:#fff!important;box-shadow:0 0 0 2px var(--mint)!important;color:var(--bark-2)!important}
.board.calm .mcell.changed,.board.calm .cell.changed{border-color:transparent!important}
.board.calm table.mgrid{border-spacing:2px 4px}
.board.calm tr.me > td{background:#e3f6ee}
.board.calm tr.me > td.col-rest{background:#dcefe6}
.board.calm table.mgrid tbody tr:hover > td{background:#fbf8f0}
.board.calm table.mgrid tbody tr.me:hover > td{background:#d5f1e5}
/* 國定假日整欄合併（直書） */
td.hol-merge{background:#fbe3a0!important;border-radius:10px;vertical-align:middle;text-align:center;box-shadow:inset 0 0 0 2px #f6cf68}

.hol-v{writing-mode:vertical-rl;text-orientation:upright;margin:0 auto;font-weight:900;color:#7a4b00;letter-spacing:.2em;font-size:13px;line-height:1.1;padding:8px 0}

.mhead.hol{background:#fbe3a0}
.dayhead.hol{background:#fff4d2;border-color:#f6cf68}
.board.calm td.col-hol{background:#fdf1cf}
.board.calm tr.me > td.col-hol{background:#f7e9bf}

/* ===== v36.8 浮動離席按鈕 ===== */
.fab-wrap{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;align-items:center;gap:8px;padding:12px 20px 12px 16px;border-radius:999px;
  background:var(--mint-d);color:#fff;box-shadow:0 6px 0 #3a9a90,0 12px 28px rgba(0,0,0,.2);font-weight:900;font-size:15px;transition:transform .15s}
.fab-wrap .fab{position:static}

.fab-away.late{background:#e53935;box-shadow:0 6px 0 #b71c1c,0 12px 28px rgba(0,0,0,.2)}

.fab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fab-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:16px;background:#faf8f2;border:2px solid var(--line);font-weight:900;font-size:13px}

.kiosk{min-height:calc(100vh - 28px);display:flex;flex-direction:column;gap:18px}

.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.k-card{background:#fff;border:5px solid var(--line);border-radius:28px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .12s}

.hol-hl.on{opacity:1}
td.hol-merge .hol-v{position:relative}

  const p = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

const TW_STEPS = { 50:0, 100:1, 200:2, 300:2, 600:3, 700:3, 800:4, 900:4 };
const colorCache = {};
const parseColor = (str = '') => {
  if (colorCache[str]) return colorCache[str];
  const out = { bg: '#f3f4f6', fg: '#374151', bd: '#e5e7eb' };
  const map = { bg: 'bg', text: 'fg', border: 'bd' };
  str.split(/\s+/).forEach(tok => {
    let m = tok.match(/^(bg|text|border)-\[(#[0-9a-fA-F]{3,8})\]$/);
    if (m) { out[map[m[1]]] = m[2]; return; }
    m = tok.match(/^(bg|text|border)-([a-z]+)-(\d+)$/);
    if (m && TW[m[2]] && TW_STEPS[m[3]] !== undefined) out[map[m[1]]] = TW[m[2]][TW_STEPS[m[3]]];
  });
  return (colorCache[str] = out);
};

const calcHours = (timeStr) => {
  if (!timeStr) return 0;
  let mins = 0;
  timeStr.split(/[,，]/).forEach(seg => {
    const p = seg.trim().split('-');
    if (p.length !== 2) return;
    const [h1, m1] = p[0].split(':').map(Number), [h2, m2] = p[1].split(':').map(Number);
    if ([h1, m1, h2, m2].some(isNaN)) return;
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 0) diff += 1440;
    mins += diff;
  });
  return mins / 60;
};

const hasLunch = (cfg) => { const sg = segsOf(cfg && cfg.defaultTime); if (sg.length !== 1) return false; return (sg[0][1] - sg[0][0]) / 60 - (Number(cfg.hours) || 0) >= 0.99; };
const overlapMin = (a1, b1, a2, b2) => Math.max(0, Math.min(b1, b2) - Math.max(a1, a2));
const segHours = (a, b, lunch) => Math.max(0, (b - a) - (lunch ? overlapMin(a, b, LUNCH[0], LUNCH[1]) : 0)) / 60;
const workSegsOfKey = (k) => { const [rid, y, m, d] = k.split('-').map(Number); return segsOf(workTimeOf(rid, y, m - 1, d)); };
const dayLunch = (k) => { const [rid, y, m, d] = k.split('-').map(Number); return hasLunch(cfgOf(shiftAt(rid, y, m - 1, d))) || hasLunch(cfgOf('正常班')); };
// 一段請假的時數（統計用）：時段長度，扣掉午休
const leaveHourOne = (k, l) => { const a = toMin(l.start), b = toMin(l.end); if (a == null || b == null) return 0; return segHours(a, b > a ? b : b + 1440, dayLunch(k)); };

const leaveOverlapOf = (k) => {
  const segs = workSegsOfKey(k), lunch = dayLunch(k); let mins = 0;
  leavesOf(k).forEach(l => { const a = toMin(l.start), b = toMin(l.end); if (a == null || b == null) return;
    segs.forEach(([s, e]) => { const o = overlapMin(a, b, s, e); if (o) mins += o - (lunch ? overlapMin(Math.max(a, s), Math.min(b, e), LUNCH[0], LUNCH[1]) : 0); }); });

// 取得一筆離席紀錄的實際起訖時間（新紀錄有 start/end；舊紀錄用「月/日」+「時:分 - 時:分」推算）

// 國定假日整欄合併：放假的人連續的幾列合併成一塊金色直書；有人值班的那一格照常顯示班別（像 Excel 合併儲存格）
const mergedHolidays = (days) => {
  const { year: y, month: m } = ui, list = orderedResidents(), out = {};
  if (!ui.calm || !list.length) return out;
  days.forEach(d => {
    if (!d) return;
    const h = holidayAt(y, m, d);
    if (!h || HOLIDAY_KINDS[h.kind]?.off === false) return;
    const isOff = list.map(r => cellTone(r.id, y, m, d) === 'rest' && !db.scheduleNotes[keyOf(r.id, y, m, d)]);
    if (!isOff.some(Boolean)) return;
    const start = new Map(), skip = new Set();
    let best = -1, bestLen = 0;
    for (let i = 0; i < isOff.length;) {
      if (!isOff[i]) { i++; continue; }
      let j = i; while (j < isOff.length && isOff[j]) j++;
      start.set(i, j - i); for (let k = i + 1; k < j; k++) skip.add(k);
      if (j - i > bestLen) { bestLen = j - i; best = i; }
      i = j;
    }
    out[d] = { h, start, skip, nameRi: best, nameLen: bestLen };
  });
  return out;
};
const holMergeCell = (d, h, n, cls, showName, nameLen) => {
  const { year: y, month: m } = ui;
  const name = h.name || HOLIDAY_KINDS[h.kind]?.label || '';
  const small = showName && name.length > n * 2 + 1;           // 列數太少放不下就縮小字
  // 合併的格子一樣可以點：依滑鼠位置判斷點到哪一個人，打開那個人當天的排班
  return `<td rowspan="${n}" class="hol-merge ${cls}" onclick="holClick(event, ${d}, ${n})" onmousemove="holHover(event, ${n})" onmouseleave="holHover(null)"
      title="${esc((HOLIDAY_KINDS[h.kind]?.label || '') + '：' + name)}・點某個人那一列可替他排值班">
    <span class="hol-hl"></span>${showName ? `<div class="hol-v ${small ? 'sm' : ''}">${esc(name)}</div>` : ''}</td>`;
};

      </div></th>${cells}</tr>`;
  }).join('');
  return `<div class="board ${ui.brush ? 'brushing' : ''} ${ui.calm ? 'calm' : ''}"><div class="board-scroll">

const monthStats = () => {
  const { year: y, month: m } = ui, n = daysIn(y, m);
  const staff = activeStaff();
  const holiday = {}, leaves = {}, hours = {}, ot = {}, leaveH = {}, byType = {}, daily = [];
  let eventCount = 0;
  staff.forEach(r => { holiday[r.id] = 0; leaves[r.id] = 0; hours[r.id] = 0; ot[r.id] = 0; leaveH[r.id] = 0; });
  for (let d = 1; d <= n; d++) {
    const w = dowOf(y, m, d), ev = eventsAt(y, m, d);
    eventCount += ev.length;
    const day = { d, w, ev, on: [], off: [], partial: [] };
    daily.push(day);
    staff.forEach(r => {
      const k = keyOf(r.id, y, m, d), shift = shiftAt(r.id, y, m, d);
      if (LEAVE_TYPES.includes(shift)) { const fh = Math.max(0, FULL_DAY_HOURS - leaveHoursOf(k)); leaveH[r.id] += fh; byType[shift] = (byType[shift] || 0) + fh; }
      leavesOf(k).forEach(l => { const h = leaveHourOne(k, l); leaveH[r.id] += h; byType[l.type] = (byType[l.type] || 0) + h; });
      if (hoursAt(r.id, y, m, d) > 0 && !OFF_TYPES.includes(shift)) day.on.push(r); else day.off.push({ r, shift });
      if (leavesOf(k).length) day.partial.push(r);
      const s = db.schedule[keyOf(r.id, y, m, d)];
      if ((isRestDay(y, m, d) || ev.length) && s && !OFF_TYPES.includes(s)) holiday[r.id]++;
      if (s && LEAVE_TYPES.includes(s)) leaves[r.id]++;
      hours[r.id] += hoursAt(r.id, y, m, d);
      ot[r.id] += otHours(keyOf(r.id, y, m, d));
    });
  }
  return { staff, holiday, leaves, hours, ot, leaveH, byType, daily, eventCount };
};

const rankList = (items, color, unit) => {
  if (!items.length) return '<div class="empty-state">目前沒有資料</div>';
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="rank">${items.map((it, i) => `
    <div class="rank-row">
      <span class="no ${i < 3 && it.v > 0 ? 'top' : ''}">#${i + 1}</span>${avatar(it.r, 30)}
      <div class="nm">${esc(it.r.name)}${it.sub ? ` <small class="muted">${it.sub}</small>` : ''}<div class="bar"><i style="width:${(it.v / max) * 100}%;background:${color}"></i></div></div>
      <span class="val num" style="color:${color}">${round1(it.v)}<small style="font-size:11px"> ${unit}</small></span>
    </div>`).join('')}</div>`;
};

const ring = (pct, color, size = 64) => {
  const r = (size - 10) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#efeadb" stroke-width="8"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c * v} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="900" fill="#5d4037">${Math.round(v * 100)}%</text></svg>`;
};
const avStack = (list, max = 5) => `<span class="avstack">${list.slice(0, max).map(r => avatar(r, 26)).join('')}${list.length > max ? `<span class="more">+${list.length - max}</span>` : ''}</span>`;

// ---------- 今日時間軸（甘特圖）----------
const renderTimeline = () => {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  const nowM = t.getHours() * 60 + t.getMinutes();
  const rows = activeStaff().map(r => {
    const k = keyOf(r.id, y, m, d), s = shiftAt(r.id, y, m, d), c = cfgOf(s), segs = [];
    const working = baseHoursAt(r.id, y, m, d) > 0;
    if (working) workTimeOf(r.id, y, m, d).split(',').forEach(p => {
      const [a, b] = p.trim().split('-').map(toMin); if (a != null && b != null) segs.push({ kind: 'work', a, b: b > a ? b : b + 1440, c, label: `${c.fullLabel} ${p.trim()}` });
    });
    leavesOf(k).forEach(l => segs.push({ kind: 'leave', a: toMin(l.start), b: toMin(l.end), c: cfgOf(l.type), label: `${l.type} ${l.start}-${l.end}` }));
    const o = otOf(k); if (o && o.start && o.end) segs.push({ kind: 'ot', a: toMin(o.start), b: toMin(o.end) > toMin(o.start) ? toMin(o.end) : toMin(o.end) + 1440, label: `加班 ${o.start}-${o.end}${o.reason ? '・' + o.reason : ''}` });
    let awayN = 0, awayM = 0;
    r.awayLog.forEach((l, i) => {
      const tt = awayTimes(l); if (!tt || !sameDay(tt.s, t)) return;
      const a = tt.s.getHours() * 60 + tt.s.getMinutes();
      awayN++; awayM += Number(l.minutes) || 0;
      segs.push({ kind: 'awayDone', a, b: a + (Number(l.minutes) || 1), reason: l.reason, mins: l.minutes, idx: i, rid: r.id, label: `${l.reason} ${l.time}（${l.minutes} 分）${canEdit(r.id) ? '・點一下可修改' : ''}` });
    });
    if (r.activeSession) { const st = new Date(r.activeSession.startTime); awayN++; awayM += awayMins(r); segs.push({ kind: 'away', a: st.getHours() * 60 + st.getMinutes(), b: nowM, label: `暫離中・${r.activeSession.reason || ''} ${awayMins(r)} 分` }); }
    return { r, s, c, segs, working, awayN, awayM };
  });
  const all = rows.flatMap(x => x.segs);
  let lo = Math.min(420, ...all.map(x => x.a)), hi = Math.max(1200, ...all.map(x => x.b), nowM + 30);
  lo = Math.floor(lo / 60) * 60; hi = Math.min(1440 + 120, Math.ceil(hi / 60) * 60);
  const pos = (x) => ((x - lo) / (hi - lo)) * 100;
  const ticks = []; for (let h = lo; h <= hi; h += 60) ticks.push(h);
  const segHTML = (g) => {
    const left = pos(Math.max(lo, g.a)), w = Math.max(0.8, pos(Math.min(hi, g.b)) - left);
    const col = g.c ? parseColor(g.c.color) : null;
    const style = g.kind === 'work' ? `background:${col.bg};border-color:${col.bd};color:${col.fg}`
      : g.kind === 'leave' ? `background:repeating-linear-gradient(135deg,${col.bg} 0 6px,#fff 6px 10px);border-color:${col.bd};color:${col.fg}`
      : '';
    if (g.kind === 'awayDone') {
      const col = AWAY_COLORS[awayCat(g.reason)];
      return `<span class="tl-seg awayDone" style="left:${left}%;width:${w}%;--c:${col}" title="${esc(g.label)}"
        ${canEdit(g.rid) ? `onclick="openModal('awayLog', {id:${g.rid}, edit:${g.idx}})"` : ''}>${esc(String(g.reason).slice(0, 1))}${g.mins}分</span>`;
    }
    const txt = g.kind === 'work' ? g.c.label : g.kind === 'leave' ? g.c.label : g.kind === 'ot' ? '加班' : '暫離';
    return `<span class="tl-seg ${g.kind}" style="left:${left}%;width:${w}%;${style}" title="${esc(g.label)}">${w > 6 ? esc(txt) : ''}</span>`;
  };
  const nowLine = nowM >= lo && nowM <= hi ? `<span class="tl-now" style="left:${pos(nowM)}%"><b>${hhmm(t)}</b></span>` : '';
  return `
  <div class="card tl-card">
    <div class="card-title"><div class="title-dot" style="background:var(--mint-d)">${icon('Clock')}</div>
      <div style="flex:1"><h2>今日時間軸</h2><p>${m + 1}/${d}（週${WD[t.getDay()]}）誰在什麼時段上班、請假、加班、暫離，一眼看完</p></div>
      <div class="tl-legend">
        <span><i style="background:#e0f2fe;border-color:#bae6fd"></i>上班</span>
        <span><i style="background:repeating-linear-gradient(135deg,#f8bbd0 0 4px,#fff 4px 7px);border-color:#f48fb1"></i>請假</span>
        <span><i style="background:#ef5350;border-color:#ef5350"></i>加班</span>
        <span><i style="background:#ffb74d;border-color:#fb8c00"></i>暫離中</span>
        <span><i style="background:#fff;border-color:#2a78d6"></i>已回崗的離席（色＝原因）</span>
      </div></div>
    <div class="tl">
      <div class="tl-row tl-head"><div class="tl-name"></div><div class="tl-track">
        ${ticks.map((h, i) => `<span class="tl-tick ${i % 2 ? 'odd' : ''}" style="left:${pos(h)}%">${pad(Math.floor(h / 60) % 24)}</span>`).join('')}</div><div class="tl-sum muted">今日離席</div></div>
      ${rows.map(x => `
      <div class="tl-row ${x.r.id === ui.userId ? 'me' : ''}">
        <div class="tl-name">${avatar(x.r, 26)}<span>${esc(x.r.name)}</span></div>
        <div class="tl-track">
          ${ticks.map(h => `<span class="tl-grid" style="left:${pos(h)}%"></span>`).join('')}
          ${x.working ? x.segs.map(segHTML).join('') : `<span class="tl-off">${esc(x.c.fullLabel)}</span>${x.segs.filter(g => g.kind !== 'work').map(segHTML).join('')}`}
          ${nowLine}
        </div>
        <div class="tl-sum ${x.awayM >= AWAY_ALERT_MINUTES ? 'hi' : ''}">${x.awayN ? `${x.awayN} 次<b>${x.awayM} 分</b>` : '<span class="muted">—</span>'}</div>
      </div>`).join('') || '<div class="empty-state">沒有在職人員</div>'}
    </div>
  </div>`;
};

const renderHeatCal = (st) => {
  const { year: y, month: m } = ui, total = st.staff.length || 1;
  const lead = (dowOf(y, m, 1) + 6) % 7;

  for (let i = 0; i < lead; i++) cells.push('<div class="hc blank"></div>');
  st.daily.forEach(day => {
    const ratio = day.on.length / total, step = day.on.length === 0 ? 0 : ratio >= 1 ? 4 : ratio >= 0.75 ? 3 : ratio >= 0.5 ? 2 : 1;
    const wkday = !isRestDay(y, m, day.d), warn = wkday && day.on.length < low && !day.ev.length;
    const leaveList = day.off.filter(o => !REST_TYPES.includes(o.shift));
    const tip = `${m + 1}/${day.d}（週${WD[day.w]}）\n上班 ${day.on.length} 人：${day.on.map(r => r.name).join('、') || '無'}` +

      (day.partial.length ? `\n部分請假：${day.partial.map(r => r.name).join('、')}` : '') +
      (day.ev.length ? `\n活動：${day.ev.map(evName).join('、')}` : '') + (holidayAt(y, m, day.d) ? `\n${HOLIDAY_KINDS[holidayAt(y, m, day.d).kind]?.label}：${holidayAt(y, m, day.d).name}` : '');
    const hol = holidayAt(y, m, day.d), rest = isRestDay(y, m, day.d);
    cells.push(`<div class="hc ${isToday(y, m, day.d) ? 'today' : ''} ${warn ? 'warn' : ''} ${rest ? 'rest' : ''}" style="background:${rest && !day.on.length ? '#f7f6f2' : HEAT[step]}" title="${esc(tip)}">
      <div class="hc-top"><span class="hc-d">${day.d}</span>${day.ev.length ? `<span class="hc-ev">${icon('Flag', 'sm')}</span>` : ''}</div>

      <div><h2>${m + 1} 月人力日曆</h2><p>綠色越明顯＝上班人數越多；紅色虛線框＝平日上班不到一半。滑過格子可看名單</p></div></div>
    <div class="hc-grid">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="hc-w">${w}</div>`).join('')}${cells.join('')}</div>
    <div class="hc-scale"><span>少</span>${HEAT.map(c => `<i style="background:${c}"></i>`).join('')}<span>多</span>
      <span style="margin-left:auto" class="muted">「請假」整天請假人數・「半天」部分時段請假人數</span></div>
  </div>`;
};

const renderDonut = (st) => {
  const entries = Object.entries(st.byType).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  const R = 62, C = 2 * Math.PI * R, GAP = entries.length > 1 ? 3 : 0;
  let acc = 0;
  const arcs = entries.map(([k, v]) => {
    const len = (v / total) * C, col = parseColor(cfgOf(k).color).bd;
    const out = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${Math.max(0, len - GAP)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${esc(k)} ${fmtHours(v)}</title></circle>`;
    acc += len; return out;
  }).join('');
  return `
  <div class="card">
    <div class="card-title"><div class="title-dot" style="background:#9575cd">${icon('Palmtree')}</div>
      <div><h2>${ui.month + 1} 月請假類別</h2><p>整天請假以 ${FULL_DAY_HOURS} 小時計，含部分時段請假</p></div></div>
    ${total ? `<div class="donut-wrap">
      <svg viewBox="0 0 160 160" class="donut" role="img" aria-label="請假類別分佈">
        <circle cx="80" cy="80" r="${R}" fill="none" stroke="#f3efe4" stroke-width="22"/>${arcs}
        <text x="80" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#8d6e63">合計</text>
        <text x="80" y="96" text-anchor="middle" font-size="20" font-weight="900" fill="#5d4037">${round1(total)}h</text>
      </svg>
      <div class="donut-legend">${entries.map(([k, v]) => `<div><i style="background:${parseColor(cfgOf(k).color).bd}"></i><span>${esc(k)}</span><b class="num">${fmtHours(v)}</b><small class="muted num">${Math.round(v / total * 100)}%</small></div>`).join('')}</div>
    </div>` : '<div class="empty-state">本月沒有人請假</div>'}
  </div>`;
};

const awayRangeOf = () => {
  const t = new Date();
  if (ui.awayRange === 'today') { const s = new Date(t.getFullYear(), t.getMonth(), t.getDate()); return { s, e: new Date(s.getTime() + 86400000), label: '今天' }; }
  if (ui.awayRange === 'week') { const s = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay() + 6) % 7)); return { s, e: new Date(s.getTime() + 7 * 86400000), label: '本週' }; }
  if (ui.awayRange === 'month') return { s: new Date(ui.year, ui.month, 1), e: new Date(ui.year, ui.month + 1, 1), label: `${ui.month + 1} 月` };
  return { s: null, e: null, label: '全部' };
};
const collectAway = () => {
  const rg = awayRangeOf(), admin = isAdmin();
  const people = db.residents.filter(r => !r.isResigned && (admin || r.id === ui.userId));
  const entries = [];
  people.forEach(r => r.awayLog.forEach((l, i) => {
    const tt = awayTimes(l);
    if (rg.s && (!tt || tt.s < rg.s || tt.s >= rg.e)) return;
    entries.push({ r, l, i, tt, cat: awayCat(l.reason), mins: Number(l.minutes) || 0 });
  }));
  return { rg, people, entries };
};
const renderAwayDonut = (byCat, title) => {
  const total = Object.values(byCat).reduce((a, b) => a + b.m, 0);
  if (!total) return '<div class="empty-state">這段期間沒有離席紀錄</div>';
  const R = 62, C = 2 * Math.PI * R, cats = Object.keys(AWAY_COLORS).filter(c => byCat[c] && byCat[c].m), GAP = cats.length > 1 ? 3 : 0;
  let acc = 0;
  const arcs = cats.map(c => { const len = byCat[c].m / total * C; const o = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${AWAY_COLORS[c]}" stroke-width="24" stroke-dasharray="${Math.max(0, len - GAP)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${c} ${fmtMins(byCat[c].m)}（${byCat[c].n} 次）</title></circle>`; acc += len; return o; }).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 160 160" class="donut" role="img" aria-label="${esc(title)}"><circle cx="80" cy="80" r="${R}" fill="none" stroke="#f3efe4" stroke-width="24"/>${arcs}
      <text x="80" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#8d6e63">共</text>
      <text x="80" y="96" text-anchor="middle" font-size="19" font-weight="900" fill="#5d4037">${Math.round(total)} 分</text></svg>
    <div class="donut-legend">${cats.map(c => `<div><i style="background:${AWAY_COLORS[c]}"></i><span>${c} <small class="muted">${byCat[c].n} 次</small></span><b class="num">${fmtMins(byCat[c].m)}</b><small class="muted num">${Math.round(byCat[c].m / total * 100)}%</small></div>`).join('')}</div>
  </div>`;
};

// 時間軸上的離席標籤：同一列依時間順序排成一排；太靠近時往右接續，不重疊、不換排
const layoutAwayChips = () => {
  document.querySelectorAll('.tl-track').forEach(tr => {
    const chips = [...tr.querySelectorAll('.tl-seg.awayDone')];
    if (chips.length < 2) return;
    chips.sort((p, q) => parseFloat(p.style.left) - parseFloat(q.style.left));
    const W = tr.clientWidth; let right = -Infinity;
    chips.forEach(c => {
      const left = parseFloat(c.style.left) / 100 * W;
      const x = Math.max(left, right + 3);
      if (x !== left) { c.style.left = x + 'px'; c.classList.add('shifted'); }
      right = x + c.offsetWidth;
    });
  });
};

// 找出合併格子裡，滑鼠所在的是哪一列（哪個人）
const holRowAt = (e, n) => {
  const td = e.currentTarget, tr = td.parentElement, rows = [...tr.parentElement.rows], start = rows.indexOf(tr);
  for (let k = start; k < start + n && k < rows.length; k++) {
    const rc = rows[k].getBoundingClientRect();
    if (e.clientY >= rc.top && e.clientY <= rc.bottom) return { row: rows[k], rc, td };
  }
  return null;
};
const holClick = (e, d, n) => { const hit = holRowAt(e, n); if (hit) cellClick(Number(hit.row.dataset.rid), d); };
const holHover = (e, n) => {
  document.querySelectorAll('.hol-hl.on').forEach(x => x.classList.remove('on'));
  if (!e) return;
  const hit = holRowAt(e, n); if (!hit) return;
  const hl = hit.td.querySelector('.hol-hl'), tdr = hit.td.getBoundingClientRect();
  hl.style.top = (hit.rc.top - tdr.top) + 'px'; hl.style.height = hit.rc.height + 'px'; hl.classList.add('on');
  const r = resById(hit.row.dataset.rid); hit.td.title = r ? `${r.name}：點一下替他排這天的班` : '';
};

// ---------- 單格排班 ----------
// 把一格的資料轉成「時段列表」：每一段 = 班別或假別 + 開始 + 結束
const blocksFromData = (rid, y, m, d) => {
  const k = keyOf(rid, y, m, d), s = shiftAt(rid, y, m, d), c = cfgOf(s), rows = [];
  const def = segsOf(c.defaultTime || '')[0] || segsOf(cfgOf('正常班').defaultTime || '08:00-17:00')[0] || [480, 1020];
  if (REST_TYPES.includes(s) && !db.scheduleTimes[k]) rows.push({ type: s, start: '', end: '' });
  else if (isLeaveType(s) && !db.scheduleTimes[k]) {
    // 整天請假：扣掉同一天其他時段，剩下的就是這個假
    const others = leavesOf(k).map(l => [toMin(l.start), toMin(l.end)]);
    const free = others.length ? [[def[0], def[1]]].flatMap(([a, b]) => { let parts = [[a, b]]; others.forEach(([x, z]) => { parts = parts.flatMap(([p, q]) => (z <= p || x >= q) ? [[p, q]] : [[p, x], [z, q]].filter(([u, v]) => v - u > 0)); }); return parts; }) : [def];
    free.forEach(([a, b]) => rows.push({ type: s, start: fromMin(a), end: fromMin(b) }));
  } else segsOf(workTimeOf(rid, y, m, d)).forEach(([a, b]) => rows.push({ type: s, start: fromMin(a), end: fromMin(b) }));
  leavesOf(k).forEach(l => rows.push({ type: l.type, start: l.start, end: l.end }));
  const o = otOf(k); if (o) rows.push({ type: '加班', start: o.start || '', end: o.end || '' });
  return rows.sort((p, q) => (toMin(p.start) ?? -1) - (toMin(q.start) ?? -1));
};
const blockHours = (b, k) => {
  const a = toMin(b.start), e = toMin(b.end); if (a == null || e == null) return 0;
  const lunch = b.type === '加班' ? false : (isLeaveType(b.type) ? dayLunch(k) : hasLunch(cfgOf(b.type)));
  return segHours(a, e > a ? e : e + 1440, lunch);
};

const shiftWeek = (delta) => {

const toggleLegend = () => { ui.showLegend = !ui.showLegend; render(); };

// 排班格
const cellClick = (rid, d) => {
  if (!canEdit(rid)) return toast('只能修改自己的班表', true);
  if (ui.brush && isAdmin()) {
    const k = keyOf(rid, ui.year, ui.month, d);
    if (ui.brush === '__clear') {
      if (!db.schedule[k] && !db.scheduleTimes[k]) return;
      delete db.schedule[k]; delete db.scheduleTimes[k];
      logAction('排班', `${whoOfKey(k)} ${shiftLabel(k)} 還原預設`);
    } else {
      if (db.schedule[k] === ui.brush) return;
      db.schedule[k] = ui.brush; delete db.scheduleTimes[k];
      logAction('排班', `${whoOfKey(k)} ${shiftLabel(k)} → ${ui.brush}`);
    }
    return commit();
  }
  openModal('cell', { rid, d });
};
const setShift = (k, s) => {
  if (db.schedule[k] === s) return;
  db.schedule[k] = s; delete db.scheduleTimes[k];
  logAction('排班', `${whoOfKey(k)} ${shiftLabel(k)} → ${s}`);
  commit(); refreshModal();
};
const resetShift = (k) => { delete db.schedule[k]; delete db.scheduleTimes[k]; delete db.scheduleLeaves[k]; if (ui.modal) ui.modal.data.blocks = null; logAction('排班', `${whoOfKey(k)} ${shiftLabel(k)} 還原預設`); commit(); refreshModal(); };
const toggleOT = (k) => {
  if (db.scheduleOvertime[k]) delete db.scheduleOvertime[k];
  else {
    // 預設從當天下班時間開始，加 1 小時
    const [rid, y, m, d] = k.split('-').map(Number);
    const work = workTimeOf(rid, y, m - 1, d).split(',').pop().trim();
    const endT = (work.split('-')[1] || '17:00').trim();
    const [h, mi] = endT.split(':').map(Number);
    db.scheduleOvertime[k] = { start: endT, end: `${pad((h + 1) % 24)}:${pad(mi || 0)}`, reason: '' };
  }
  logAction('加班', `${whoOfKey(k)} ${shiftLabel(k)} ${db.scheduleOvertime[k] ? '標記加班' : '取消加班'}`);
  commit(); refreshModal();
};
const saveOT = (k) => {
  const o = otOf(k); if (!o) return;
  const s = val('ot-start'), e = val('ot-end'), reason = val('ot-reason');
  const next = { start: s || '', end: e || '', reason: reason || '' };
  if (JSON.stringify(next) === JSON.stringify(db.scheduleOvertime[k])) return;
  const timeChanged = next.start !== o.start || next.end !== o.end;
  db.scheduleOvertime[k] = next;
  if (timeChanged) logAction('加班', `${whoOfKey(k)} ${shiftLabel(k)} 加班 ${next.start}-${next.end}`);
  const tag = document.getElementById('ot-hours');
  if (tag) tag.textContent = otHours(k) ? `加班 ${round1(otHours(k))} 小時` : '尚未填時間';
  commit();                                   // 只重畫背後的班表，不重畫視窗，打字不會被打斷
};
let otTimer, noteTimer;
const flushCellInputs = () => {
  const { rid, d } = ui.modal.data, k = keyOf(rid, ui.year, ui.month, d);
  clearTimeout(otTimer); clearTimeout(noteTimer);
  if (document.getElementById('ot-reason')) saveOtReason(k);
  const n = document.getElementById('note-input'); if (n) saveNote(k, n.value);
};
const debounceOT = (k) => { clearTimeout(otTimer); otTimer = setTimeout(() => saveOtReason(k), 600); };
const debounceNote = (k, v) => { clearTimeout(noteTimer); noteTimer = setTimeout(() => saveNote(k, v), 600); };
const enterBlur = (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) e.target.blur(); };
const leavePreset = (startMin, endMin) => {
  const s = document.getElementById('lv-start'), e = document.getElementById('lv-end');
  if (s && e) { s.value = fromMin(startMin); e.value = fromMin(endMin); }
};
const addLeave = (k) => {
  const type = val('lv-type'), s = val('lv-start'), e = val('lv-end');
  if (!type || !s || !e) return toast('請選擇假別並填寫時間', true);
  if (toMin(e) <= toMin(s)) return toast('結束時間要晚於開始時間', true);
  db.scheduleLeaves[k] = [...leavesOf(k), { type, start: s, end: e }].sort((a, b) => toMin(a.start) - toMin(b.start));
  logAction('請假', `${whoOfKey(k)} ${shiftLabel(k)} ${type} ${s}-${e}`);
  commit(); refreshModal();
};
const removeLeave = (k, i) => {
  const list = [...leavesOf(k)], l = list.splice(i, 1)[0];
  if (list.length) db.scheduleLeaves[k] = list; else delete db.scheduleLeaves[k];
  logAction('請假', `${whoOfKey(k)} ${shiftLabel(k)} 取消 ${l.type} ${l.start}-${l.end}`);
  commit(); refreshModal();
};
// ---------- 分時段：把時段列表寫回資料 ----------
const applyBlocks = (k, opts = {}) => {
  const blocks = ui.modal.data.blocks.filter(b => b.type);
  const [rid, y, m, d] = k.split('-').map(Number);
  const before = cellSig(rid, y, m - 1, d);
  const work = blocks.filter(b => b.type !== '加班' && !isLeaveType(b.type));
  const leaves = blocks.filter(b => isLeaveType(b.type) && b.start && b.end);
  const ots = blocks.filter(b => b.type === '加班');
  delete db.scheduleTimes[k]; delete db.scheduleLeaves[k];
  if (work.length) {
    const main = work[0].type, c = cfgOf(main);
    db.schedule[k] = main;
    const segs = work.filter(b => b.start && b.end).map(b => `${b.start}-${b.end}`);
    const norm = (t) => segsOf(t).map(([a, b]) => `${a}-${b}`).join(',');
    if (segs.length && norm(segs.join(',')) !== norm(c.defaultTime || '')) db.scheduleTimes[k] = segs.join(', ');
    if (leaves.length) db.scheduleLeaves[k] = leaves.map(b => ({ type: b.type, start: b.start, end: b.end }));
  } else if (leaves.length) {
    db.schedule[k] = leaves[0].type;                          // 沒有上班時段：當天以第一個假別為主
    if (leaves.length > 1) db.scheduleLeaves[k] = leaves.slice(1).map(b => ({ type: b.type, start: b.start, end: b.end }));
  } else if (!blocks.length) delete db.schedule[k];
  if (ots.length) { const o = otOf(k) || {}; db.scheduleOvertime[k] = { start: ots[0].start || '', end: ots[0].end || '', reason: o.reason || '' }; }
  else delete db.scheduleOvertime[k];
  const after = cellSig(rid, y, m - 1, d);
  if (before !== after || opts.log) logAction('排班', `${whoOfKey(k)} ${shiftLabel(k)} → ${sigText(after)}${ots.length && ots[0].start ? `，加班 ${ots[0].start}-${ots[0].end}` : ''}`);
  commit();
};
const wholeDay = (k, s) => {
  const c = cfgOf(s), sg = segsOf(c.defaultTime || '');

  const list = db.holidayEvents[k]; if (!list) return;
  const e = list.splice(i, 1)[0]; if (!list.length) delete db.holidayEvents[k];
  logAction('活動', `刪除 ${k} ${evName(e)}`);
  commit(); refreshModal();
};

// 紀錄搜尋（只更新表格，保留輸入框焦點）
const filterLogs = (v) => {
  ui.logQuery = v;
  const main = document.getElementById('main'); if (!main) return;
  const pos = document.getElementById('log-q').selectionStart;
  main.innerHTML = renderAudit();
  const inp = document.getElementById('log-q'); inp.focus(); inp.setSelectionRange(pos, pos);
};

// 匯出 / 列印
const exportCSV = () => {
  const { year: y, month: m } = ui, n = daysIn(y, m);
  const q = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['日期','星期','國定假日','姓名','班別','原訂班別(臨時改班)','時間','工時','部分請假','加班','加班時段','加班時數','加班事由','備註','當日活動','代理1','代理2','累積離席(分)','特休總時數','已用特休','累積假日班']];
  for (let d = 1; d <= n; d++) db.residents.forEach(r => {
    const k = keyOf(r.id, y, m, d);
    rows.push([`${y}/${m + 1}/${d}`, WD[dowOf(y, m, d)], holidayAt(y, m, d) ? holidayAt(y, m, d).name : '', r.name, shiftAt(r.id, y, m, d), changedAt(r.id, y, m, d) ? sigText(planSigAt(r.id, y, m, d)) : '', db.scheduleTimes[k] || '', round1(hoursAt(r.id, y, m, d)),
      leavesOf(k).map(l => `${l.type} ${l.start}-${l.end}`).join('、'), otOf(k) ? '是' : '', otOf(k) && otOf(k).start ? `${otOf(k).start}-${otOf(k).end}` : '', otHours(k) ? round1(otHours(k)) : '', otOf(k) ? otOf(k).reason || '' : '', db.scheduleNotes[k] || '', eventsAt(y, m, d).map(evName).join('、'),
      resById(r.deputy1)?.name || '', resById(r.deputy2)?.name || '', r.awayMinutes || 0, r.annualLeaveTotal || 0, r.usedLeaveHours || 0, r.accumulatedHolidayShifts || 0]);
  });
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `視聽中心班表_${y}-${pad(m + 1)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已匯出 CSV');
};
const printMonth = () => {
  const prev = ui.view; ui.view = 'month'; render();
  const restore = () => { ui.view = prev; render(); window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(() => window.print(), 50);
};

// 雲端 / 登入
const manualSync = async () => {
  if (savePending) { clearTimeout(saveTimer); await saveToCloud(); toast('已上傳最新修改'); return; }
  const ok = await loadFromCloud();
  afterCloudLoad(); render();
  ok ? toast('已同步最新資料') : toast(cloudErr || '同步失敗，請檢查網路', true);
};
const afterCloudLoad = () => {
  if (ui.userId !== null && ui.userId !== 0 && !resById(ui.userId)) { ui.userId = null; ui.modal = null; renderModal(); toast('帳號已不存在，請重新登入', true); }
};
const lc = (v) => String(v ?? '').trim().toLowerCase();
const findUser = (u, p) => db.residents.find(r => lc(r.username) === lc(u) && lc(r.password ?? r.username) === lc(p));   // 帳號、密碼都不分大小寫
const doLogin = async () => {
  const u = val('login-user'), p = val('login-pass'), err = document.getElementById('login-err'), btn = document.getElementById('login-btn');
  const fail = (msg) => { err.textContent = msg; err.classList.remove('hidden'); };
  if (!u || !p) return fail('請輸入帳號與密碼');
  let user = null;
  if (lc(u) === BUILTIN_ADMIN.username && lc(p) === BUILTIN_ADMIN.password) user = BUILTIN_ADMIN.user;
  else {
    user = findUser(u, p);
    if (!user && gasReady()) {
      btn.innerHTML = `${icon('RefreshCw', 'spin')} 雲端驗證中…`; btn.disabled = true;
      await loadFromCloud();
      user = findUser(u, p);
      btn.innerHTML = `${icon('LogIn')} 登入系統`; btn.disabled = false;
    }
  }
  if (!user) return fail('帳號或密碼錯誤（或雲端資料尚未同步）');
  if (user.isResigned) return fail('此帳號已設為離職，無法登入');
  try {
    if (chk('remember-me')) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u, id: user.id, auto: true }));
    else localStorage.removeItem(REMEMBER_KEY);
  } catch (e) {}
  ui.userId = user.id; ui.tab = 'schedule'; ui.view = 'month'; ui.week = null;
  render(); updateTitle(); checkAwayPrompt();
  if (user.id === 0) loadFromCloud({ silent: true }).then(() => { afterCloudLoad(); render(); });
};
const logout = () => {
  try { const r = JSON.parse(localStorage.getItem(REMEMBER_KEY) || '{}'); if (r.u) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: r.u })); } catch (e) {}
  ui.userId = null; ui.brush = null; ui.modal = null; renderModal(); render();
};

// 時鐘 / 自動同步
let lastMinute = -1, syncCounter = 0;
const typing = () => { const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName); };
const tickClock = () => { const el = document.getElementById('clock'); if (el) el.textContent = hhmm(new Date()); };
setInterval(async () => {
  tickClock();
  const nowD = new Date();
  if (nowD.getMinutes() !== lastMinute) {          // 每分鐘更新一次離席計時
    lastMinute = nowD.getMinutes();
    if ((me() || ui.kiosk) && !ui.modal && !typing()) render();
    updateTitle();
    const u = me(), r = u && u.id !== 0 ? resById(u.id) : null;
    if (r && r.activeSession && awayMins(r) === AWAY_ALERT_MINUTES && document.visibilityState === 'visible') checkAwayPrompt();
  }
  if (++syncCounter >= (ui.kiosk ? 30 : AUTO_SYNC_SECONDS)) {
    syncCounter = 0;
    if ((me() || ui.kiosk) && !ui.modal && !savePending && !saving && !typing() && document.visibilityState === 'visible') {
      if (await loadFromCloud({ silent: true })) { afterCloudLoad(); if (!ui.modal && !typing()) render(); else paintStatus(); }
      else paintStatus();
    }
  }
}, 1000);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !ui.modal || e.isComposing || e.keyCode === 229) return;   // 注音/拼音選字時按 Esc 不關視窗
  if (typing()) { document.activeElement.blur(); return; }                               // 在輸入框裡按 Esc 只離開輸入框
  closeModal();
});
// 回到這個分頁時，如果自己還是暫離中，就問一下是不是忘了按回崗
const checkAwayPrompt = () => {
  const u = me(); if (!u || u.id === 0 || ui.modal) return;
  const r = resById(u.id); if (!r || !r.activeSession) return;
  if (awayMins(r) < 5 || Date.now() - ui.awayPromptAt < 10 * 60000) return;
  ui.awayPromptAt = Date.now();
  openModal('away', { id: r.id, welcome: true });
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); checkAwayPrompt(); } });
// 分頁標題也顯示暫離狀態，切到別的分頁時一樣看得到
const updateTitle = () => {
  const u = me(), r = u && u.id !== 0 ? resById(u.id) : null;
  document.title = r && r.activeSession ? `⏳ 暫離 ${awayMins(r)} 分｜按我回崗` : '視聽中心排班系統';
};
window.addEventListener('hashchange', () => { const k = /kiosk/i.test(location.hash); if (k !== ui.kiosk) { ui.kiosk = k; render(); } });
window.addEventListener('beforeunload', (e) => { if (savePending || saving) { e.preventDefault(); e.returnValue = ''; } });

// 啟動
(async () => {
  cacheLoad();
  let rem = {};
  try { rem = JSON.parse(localStorage.getItem(REMEMBER_KEY) || '{}'); } catch (e) {}
  if (rem.auto && (rem.id === 0 || resById(rem.id))) ui.userId = rem.id;
  render();
  if (gasReady()) {
    await loadFromCloud({ silent: !me() });
    if (!ui.userId && rem.auto && resById(rem.id)) ui.userId = rem.id;   // 第一次在這台裝置，快取還沒有資料
    afterCloudLoad();
    if (!ui.modal && !typing()) render(); else paintStatus();
    if (cloudErr) toast(cloudErr, true);
    updateTitle(); checkAwayPrompt();
  } else { ui.cloud = 'offline'; paintStatus(); }
})();

</script>
</body>
